name: 'Node Prepare Job'
description: 'Composite GitHub Action for Node.js monorepo jobs'
inputs:
  job-name:
    description: 'Name of the job'
    required: true
    default: 'Node Job'
  run-script:
    description: 'pnpm script to run'
    required: true
  artifact-name:
    description: 'Name of the artifact to upload'
    required: false
    default: ''
  artifact-path:
    description: 'Path of the artifact to upload'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Enable corepack
      run: corepack enable
      shell: bash

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'pnpm'

    - name: Restore pnpm store cache
      uses: actions/cache@v4
      with:
        path: ~/.pnpm-store
        key: pnpm-store-${{ runner.os }}-20-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-20-

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash

    - name: Nuxt prepare
      run: pnpm nuxt prepare
      shell: bash

    - name: Run script
      run: pnpm ${{ inputs.run-script }}
      shell: bash

    - name: Show summary
      if: always()
      run: |
        cat .${{ inputs.run-script }}* || echo "No summary file found."
      shell: bash
      
    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name != '' && inputs.artifact-name || inputs.run-script }}-results
        path: ${{ inputs.artifact-path != '' && inputs.artifact-path || format('.{0}* .pnpm-debug.log', inputs.run-script) }}
